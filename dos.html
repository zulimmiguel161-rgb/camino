<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ansiedad</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html, body { height: 100%; margin: 0; background: #0e2a47; }
  body { color: #f2efe9; font-family: "Trebuchet MS", system-ui, sans-serif; overflow: hidden;
         touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  main { position: relative; z-index: 1; height: 100%; box-sizing: border-box; display: flex;
         flex-direction: column; justify-content: flex-end; padding: 1.5rem 1.5rem 2.5rem; pointer-events: none; }
  h1 { margin: 0; font-size: clamp(2rem, 8vw, 4.5rem); font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
  .boton {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 1rem);
  right: 1rem;
  z-index: 2;                 /* para quedar encima del canvas */
  padding: 0.8rem 1.4rem;
  border-radius: 999px;
  background: #f2efe9;
  color: #0e2a47;
  text-decoration: none;
  font-weight: 700;
}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<main><h1 id="msg">Todo está bien.</h1></main>
<a class="boton" href="tres.html">Aquí llegué</a>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var msg = document.getElementById('msg');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function rgb(hex) { var n = parseInt(hex.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
  function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function css(c) { return 'rgb(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ')'; }

  // Calma -> tensión
  var calm  = ['#7fd1c7', '#8fb8ff', '#b7e0ff', '#a2f0d5'].map(rgb);
  var tense = ['#c0392b', '#d4a017', '#6b3fa0', '#8a9a5b'].map(rgb);
  var bgCalm = rgb('#0e2a47'), bgTense = rgb('#1a0f14');

  var SPACING = 44, w, h, dpr, cols, rows, stage = -1;
  var finger = { x: -9999, y: -9999 };

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    SPACING = w < 600 ? 44 : 70;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cols = Math.ceil(w / SPACING) + 1;
    rows = Math.ceil(h / SPACING) + 1;
    if (reduce) draw(35000);
  }

  function setText(a) {
    var s = a < 0.3 ? 0 : a < 0.65 ? 1 : 2;
    if (s === stage) return;
    stage = s;
    msg.textContent = ['Todo está bien.', 'Algo se siente raro.', 'Respira.'][s];
  }

  var last = 0;
  function draw(t) {
    // nivel de ansiedad 0 -> 1 en ~50 s (suavizado)
    var a = Math.min(1, t / 50000);
    a = a * a * (3 - 2 * a);
    setText(a);

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = css(mix(bgCalm, bgTense, a));
    ctx.fillRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'screen';
    ctx.globalAlpha = 0.6;

    var cx = w / 2, cy = h / 2;
    var waveSpeed = 0.0015 + a * 0.004;
    var heartRate = 0.003 + a * 0.011;               // el "corazón" se acelera
    var beat = Math.pow((Math.sin(t * heartRate) + 1) / 2, 6);

    for (var i = 0; i < cols; i++) {
      for (var j = 0; j < rows; j++) {
        var x = i * SPACING, y = j * SPACING;

        // temblor: crece con la ansiedad
        x += (Math.random() - 0.5) * a * 7;
        y += (Math.random() - 0.5) * a * 7;

        // miedo: los círculos huyen del dedo
        var dx = x - finger.x, dy = y - finger.y;
        var dist = Math.hypot(dx, dy) || 1;
        var push = Math.max(0, 1 - dist / (SPACING * 4));
        x += (dx / dist) * push * SPACING * 1.3;
        y += (dy / dist) * push * SPACING * 1.3;

        var d = Math.hypot(i * SPACING - cx, j * SPACING - cy);
        var wave = (Math.sin(t * waveSpeed - d * 0.012) + 1) / 2;

        // los círculos se encogen y se vuelven erráticos
        var shrink = 1 - a * 0.45;
        var r = SPACING * (0.08 + wave * 0.5 * shrink + beat * a * 0.35);
        r *= 1 - push * 0.5;
        r += Math.random() * a * 2;

        // el color se "contagia" círculo por círculo
        var hsh = Math.abs(Math.sin(i * 12.9898 + j * 78.233) * 43758.5453) % 1;
        var ca = Math.max(0, Math.min(1, a * 1.5 - hsh * 0.5));
        var k = (i + j) % 4;

        ctx.beginPath();
        ctx.arc(x, y, Math.max(0.5, r), 0, Math.PI * 2);
        ctx.fillStyle = css(mix(calm[k], tense[k], ca));
        ctx.fill();
      }
    }
  }

  function loop(t) { draw(t); requestAnimationFrame(loop); }

  function move(e) {
    var p = e.touches ? e.touches[0] : e;
    finger.x = p.clientX; finger.y = p.clientY;
  }
  window.addEventListener('touchstart', move, { passive: true });
  window.addEventListener('touchmove', move, { passive: true });
  window.addEventListener('touchend', function () { finger.x = -9999; finger.y = -9999; });
  window.addEventListener('mousemove', move);
  window.addEventListener('resize', resize);

  resize();
  if (!reduce) requestAnimationFrame(loop);
})();
</script>
</body>
</html>
