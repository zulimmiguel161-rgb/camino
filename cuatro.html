<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dolor</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html, body { height: 100%; margin: 0; background: #1a0707; }
  body { color: #f6e3d8; font-family: "Trebuchet MS", system-ui, sans-serif; overflow: hidden;
         touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  main { position: relative; z-index: 1; height: 100%; box-sizing: border-box; display: flex;
         flex-direction: column; justify-content: flex-end; padding: 1.5rem 1.5rem 2.5rem; pointer-events: none; }
  h1 { margin: 0; font-size: clamp(2.5rem, 10vw, 5.5rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
  .boton {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 1rem);
    right: 1rem;
    z-index: 2;
    padding: 0.8rem 1.4rem;
    border-radius: 999px;
    background: #f6e3d8;
    color: #1a0707;
    text-decoration: none;
    font-weight: 700;
  }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<main><h1>...</h1></main>
<a class="boton" href="index.html">?</a>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function rgb(hex) { var n = parseInt(hex.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
  function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function css(c) { return 'rgb(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ')'; }

  var cold = rgb('#6e1b1b');   // dolor sordo
  var hot  = rgb('#ff5a1f');   // punzada
  var peak = rgb('#ffe3b0');   // lo más agudo

  var SPACING = 44, w, h, dpr, cols, rows;
  var stabs = [];
  var nextStab = 0;
  var core = { x: 0, y: 0 };

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    SPACING = w < 600 ? 44 : 70;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cols = Math.ceil(w / SPACING) + 1;
    rows = Math.ceil(h / SPACING) + 1;
    core.x = w * 0.4; core.y = h * 0.42;
    if (reduce) draw(2000);
  }

  function addStab(x, y, t, big) {
    stabs.push({ x: x, y: y, t0: t, power: big ? 1 : 0.6 + Math.random() * 0.4 });
    if (stabs.length > 8) stabs.shift();
  }

  function draw(t) {
    // punzadas al azar
    if (t > nextStab) {
      addStab(Math.random() * w, Math.random() * h, t, false);
      nextStab = t + 900 + Math.random() * 2200;
    }
    stabs = stabs.filter(function (s) { return t - s.t0 < 1400; });

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#1a0707';
    ctx.fillRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'screen';

    // latido grave y lento: sube de golpe y baja despacio
    var throb = Math.pow((Math.sin(t * 0.0029) + 1) / 2, 3);

    for (var i = 0; i < cols; i++) {
      for (var j = 0; j < rows; j++) {
        var x = i * SPACING, y = j * SPACING;

        var dc = Math.hypot(x - core.x, y - core.y);
        var fromCore = Math.max(0, 1 - dc / (Math.max(w, h) * 0.75));
        var heat = throb * fromCore * 0.8;

        // cada punzada: ataque rápido, caída lenta
        for (var k = 0; k < stabs.length; k++) {
          var s = stabs[k];
          var age = t - s.t0;
          var ds = Math.hypot(x - s.x, y - s.y);
          var reach = Math.max(0, 1 - ds / (SPACING * 4.5));
          var env = age < 90 ? age / 90 : Math.exp(-(age - 90) / 380);
          heat = Math.max(heat, reach * env * s.power);
        }
        heat = Math.min(1, heat);

        // el dolor hace temblar
        var shake = heat * heat * 5;
        var px = x + (Math.random() - 0.5) * shake;
        var py = y + (Math.random() - 0.5) * shake;

        var r = SPACING * (0.07 + heat * 0.62);
        var col = heat < 0.6 ? mix(cold, hot, heat / 0.6) : mix(hot, peak, (heat - 0.6) / 0.4);

        ctx.globalAlpha = 0.45 + heat * 0.5;
        ctx.beginPath();
        ctx.arc(px, py, Math.max(0.5, r), 0, Math.PI * 2);
        ctx.fillStyle = css(col);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  function loop(t) { draw(t); requestAnimationFrame(loop); }

  function touch(e) {
    var p = e.touches ? e.touches[0] : e;
    addStab(p.clientX, p.clientY, performance.now(), true);
  }
  window.addEventListener('touchstart', touch, { passive: true });
  window.addEventListener('mousedown', touch);
  window.addEventListener('resize', resize);

  resize();
  if (!reduce) requestAnimationFrame(loop);
})();
</script>
</body>
</html>
